# WINDOWS / Docker Desktop / VPS tanpa host mode
# Pakai ini jika network_mode: host error (Windows tidak support)
# Ganti rustdesk.example.com dengan domain/IP VPS kamu

services:
  hbbs:
    container_name: hbbs
    image: rustdesk/rustdesk-server:latest
    command: hbbs -r rustdesk.example.com:21117
    volumes:
      - ./data:/root
    ports:
      - "21115:21115/tcp"    # NAT type test
      - "21116:21116/tcp"    # TCP hole punching
      - "21116:21116/udp"    # ID registration & heartbeat (WAJIB UDP)
      - "21118:21118/tcp"    # WebSocket web client (opsional)
    restart: unless-stopped
    depends_on:
      - hbbr

  hbbr:
    container_name: hbbr
    image: rustdesk/rustdesk-server:latest
    command: hbbr -k _
    volumes:
      - ./data:/root
    ports:
      - "21117:21117/tcp"    # Relay
      - "21119:21119/tcp"    # WebSocket relay (opsional)
    restart: unless-stopped
