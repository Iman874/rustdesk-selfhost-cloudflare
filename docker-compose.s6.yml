# ALTERNATIF: single container s6-overlay (hbbs+hbbr jadi 1)
# Cocok untuk VPS kecil / Synology. Data key di ./data, DB di ./db
# Docs: https://github.com/rustdesk/rustdesk-server

services:
  rustdesk-server:
    container_name: rustdesk-server
    image: ghcr.io/rustdesk/rustdesk-server-s6:latest
    ports:
      - "21115:21115/tcp"
      - "21116:21116/tcp"
      - "21116:21116/udp"
      - "21117:21117/tcp"
      - "21118:21118/tcp"
      - "21119:21119/tcp"
    environment:
      - RELAY=rustdesk.example.com:21117
      - ENCRYPTED_ONLY=1
      # - DB_URL=/db/db_v2.sqlite3  # uncomment jika butuh persist DB custom
    volumes:
      - ./data:/data
      - ./db:/db
    restart: unless-stopped
